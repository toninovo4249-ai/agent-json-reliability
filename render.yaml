# Do not deploy until a Render (or other) account exists. Do not add a card unless required.
# Custom domain is optional. Sleep after ~15 minutes idle is expected on Free.
services:
  - type: web
    name: agent-json-reliability
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python serve.py
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PUBLIC_BETA_CONFIRM
        value: "true"
      - key: FREE_BETA
        value: "true"
      - key: X402_PAYMENT_ENABLED
        value: "true"
      - key: PAID_ROUTE_ENABLED
        value: "true"
      - key: MAINNET_PAYMENT_ENABLED
        value: "true"
      - key: X402_FACILITATOR
        value: "payai"
      - key: FIRST_PAID_BUYER_MODE
        value: "true"
      - key: SELLER_SPEND_ALLOWED
        value: "false"
      - key: X402_NETWORK
        value: "eip155:8453"
      - key: X402_PRICE_ATOMIC
        value: "3000"
      - key: X402_USDC_BASE
        value: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      - key: SELLER_RECEIVE_ADDRESS
        sync: false
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
