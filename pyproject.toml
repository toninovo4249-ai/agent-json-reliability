[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-json-reliability"
version = "0.1.0"
description = "Deterministic JSON repair and JSON Schema validation for AI agents and software. No LLM required."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Agent JSON Reliability contributors"}]
keywords = ["json", "json-schema", "json-repair", "ai-agents", "mcp", "structured-output", "x402", "fastapi", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "jsonschema>=4.23.0",
]

[project.urls]
Homepage = "https://github.com/toninovo4249-ai/agent-json-reliability"

[project.scripts]
agent-json-reliability = "products.gateway.mcp_stdio:main"
agent-json-reliability-serve = "serve:main"

[tool.setuptools.packages.find]
include = ["products*"]

[tool.setuptools]
py-modules = ["serve"]
